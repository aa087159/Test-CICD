name: Deploy to Firebase (production)

on:
  push:
    branches: [production]

# Serialize deploys to the "production" site so concurrent pushes don't race
concurrency:
  group: firebase-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Firebase Hosting (production)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting (production)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_PRODUCTION }}
          projectId: test-cicd-production
          target: production
          channelId: live
