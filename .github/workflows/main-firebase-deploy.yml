name: Deploy to Firebase (main)

on:
  push:
    branches: [main]

# Serialize deploys to the "main" site so concurrent pushes don't race
concurrency:
  group: firebase-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Firebase Hosting (main)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting (main)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_MAIN }}
          projectId: test-cicd-90487
          target: main
          channelId: live
