name: Deploy to Firebase (staging)

on:
  push:
    branches: [staging]

# Serialize deploys to the "staging" site so concurrent pushes don't race
concurrency:
  group: firebase-deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Firebase Hosting (staging)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting (staging)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_STAGING }}
          projectId: test-cicd-staging
          target: staging
          channelId: live
