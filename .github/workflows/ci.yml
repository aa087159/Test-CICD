name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Re-run CI when the base branch is updated (e.g. after a PR merges to main),
  # so semantic merge conflicts are caught without requiring branches to be up to date.
  push:
    branches: [main]

# Cancel in-progress runs for the same ref to save CI minutes
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Type-check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
